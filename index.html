<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>X</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#fff;--ink:#0f1419;--sub:#536471;--line:#eff3f4;--blue:#1d9bf0;--pink:#f91880;--green:#00ba7c;--card:#f7f9f9}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
img,video{display:block}
#app{max-width:600px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(60px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 14px;gap:12px}

.logo{font-size:24px;font-weight:900;letter-spacing:-1px;font-family:"Arial Black",-apple-system,sans-serif}
.av{border-radius:50%;object-fit:cover;background:#cfd9de;flex-shrink:0;display:block}
.avb{border-radius:50%;background:#cfd9de;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
.avb svg{width:60%}
.tabs{display:flex;position:relative}
.tabs button{flex:1;padding:14px 0 12px;color:var(--sub);font-weight:500;position:relative;white-space:nowrap}

.tabs .plus{flex:0 0 46px;font-size:22px;color:var(--ink)}
.tabs.scroll{overflow-x:auto;scrollbar-width:none}.tabs.scroll::-webkit-scrollbar{display:none}.tabs.scroll button{flex:0 0 auto;padding:14px 16px 12px}
.ic{width:22px;height:22px;display:block}
.pst{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.pst .l{flex-shrink:0}.pst .r{flex:1;min-width:0}
.pin{font-size:13px;color:var(--sub);font-weight:700;display:flex;align-items:center;gap:6px;margin:0 0 4px -2px}

.hd{display:flex;align-items:center;gap:4px;font-size:15px;min-width:0}
.hd b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1}

.rt{color:var(--sub);font-size:14.5px;margin-top:1px}.rt span,.tx a,.tx .m{color:var(--blue);text-decoration:none}
.tx{white-space:pre-wrap;word-break:break-word;line-height:1.38;margin-top:2px}

.md img,.md video{width:100%;height:100%;object-fit:cover;background:#eee}
.md.n1 img,.md.n1 video{max-height:520px;height:auto}
.md.n2{grid-template-columns:1fr 1fr;height:260px}
.md.n3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;height:260px}.md.n3>:first-child{grid-row:1/3}
.md.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;height:260px}
.qt{border:1px solid #cfd9de;border-radius:16px;margin-top:10px;overflow:hidden}
.qt .in{padding:10px 12px}.qt .hd{font-size:14.5px}.qt .tx{font-size:14.5px}

.lc{border:1px solid #cfd9de;border-radius:16px;margin-top:10px;overflow:hidden;position:relative}

.act{display:flex;justify-content:space-between;margin-top:10px;color:var(--sub);max-width:440px}

.fab{position:fixed;right:max(16px,calc(50% - 284px));bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(29,155,240,.35);z-index:25}

.showall{color:var(--blue);font-size:14.5px;margin-top:4px;display:block}
.srch{flex:1;display:flex;align-items:center;gap:8px;background:#eff3f4;border-radius:20px;height:38px;padding:0 14px;color:var(--sub)}

.srch svg{width:17px;height:17px}

.heroadd{display:flex;align-items:center;justify-content:center;height:120px;margin:10px 14px;border:1.5px dashed #cfd9de;border-radius:14px;color:#f97316;font-weight:700}

.hero img{width:100%;height:100%;object-fit:cover}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:14px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff}
.hero .cap b{font-size:23px;font-weight:800;display:block;line-height:1.25}.hero .cap p{font-size:17px;margin-top:4px}.hero .cap small{font-size:15px;opacity:.9;display:block;margin-top:8px}
.tr{display:flex;align-items:center;padding:20px 14px;cursor:pointer;position:relative}
.tr::after{content:"";position:absolute;left:14px;right:14px;bottom:0;border-bottom:1px solid var(--line)}
.tr .bd{flex:1;min-width:0}.tr b{font-size:17px;font-weight:800;display:block;line-height:1.3}.tr span{font-size:15px;font-weight:600;color:var(--sub);display:block;margin-top:6px}.tr .bd>span:first-child{margin:0 0 4px}.tr .mo{color:#8b98a5}
.cr{display:flex;gap:12px;padding:12px 14px;cursor:pointer;align-items:center}
.cr .bd{flex:1;min-width:0}.cr .t1{display:flex;gap:6px}.cr .t1 b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cr .t1 span{margin-left:auto;color:var(--sub);font-size:13.5px;flex-shrink:0}

.sel{display:flex;align-items:center;gap:4px;border:1px solid #cfd9de;border-radius:16px;padding:4px 10px;font-size:13.5px;font-weight:600}
.msgs{padding:12px 14px 90px;display:flex;flex-direction:column;gap:6px}
.ms{max-width:78%;padding:10px 14px;border-radius:22px;font-size:15px;line-height:1.35;white-space:pre-wrap;word-break:break-word;background:#eff3f4;align-self:flex-start;border-bottom-left-radius:6px}
.ms.me{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-left-radius:22px;border-bottom-right-radius:6px}
.ms.im{padding:0;background:none;overflow:hidden}.ms.im img{max-width:240px;border-radius:18px}
.mt{font-size:12px;color:var(--sub);align-self:center;margin:6px 0}
.cin{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:31}

.cin input{flex:1;background:#eff3f4;border:0;border-radius:20px;height:40px;padding:0 14px;outline:0}
.cin button{color:var(--blue);font-weight:700}
.pf .bn{height:130px;background:#cfd9de;position:relative}.pf .bn img{width:100%;height:100%;object-fit:cover}
.pf .tb{position:absolute;top:calc(8px + env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:8px}

.pf .tb .sp{flex:1}
.pf .ar{display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px;margin-top:-38px;position:relative}
.pf .ar .av,.pf .ar .avb{border:4px solid #fff}
.pf .ar .bt{display:flex;gap:8px;margin-bottom:4px}
.pf .ar .bt button{border:1px solid #cfd9de;border-radius:18px;height:34px;min-width:34px;padding:0 9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14.5px}
.pf .ar .bt svg{width:18px;height:18px}
.pf .in{padding:10px 14px 0}

.pf .fm{font-size:12px;background:#eff3f4;color:var(--sub);border-radius:4px;padding:1px 5px}
.pf .bio{margin-top:10px;white-space:pre-wrap;line-height:1.38}
.pf .jn{color:var(--sub);margin-top:10px;display:flex;align-items:center;gap:5px;font-size:14.5px}.pf .jn svg{width:17px;height:17px}
.pf .fc{margin-top:8px;font-size:14.5px;color:var(--sub)}.pf .fc b{color:var(--ink)}
.pf .mu{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--sub)}
.pf .mu .st{display:flex}.pf .mu .st>*{margin-left:-6px;border:2px solid #fff}.pf .mu .st>:first-child{margin-left:0}
.pf .bb{display:flex;gap:8px;margin:12px 0 4px}.pf .bb button{flex:1;border:1px solid #cfd9de;border-radius:18px;height:36px;font-weight:700}
.ptabs{display:flex;border-bottom:1px solid var(--line);margin-top:8px}
.ptabs button{flex:1;padding:12px 0;display:flex;align-items:center;justify-content:center;gap:4px;color:var(--sub);position:relative;font-weight:600}
.ptabs button svg{width:20px;height:20px}.ptabs button.on{color:var(--ink)}
.ptabs button.on::after{content:"";position:absolute;bottom:0;left:22%;right:22%;height:4px;border-radius:2px;background:var(--blue)}
.big{padding:12px 14px;border-bottom:1px solid var(--line)}
.big .tx{font-size:17px;margin-top:10px}.big .dt{color:var(--sub);font-size:14.5px;margin-top:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}

.big .act{max-width:none;padding-top:10px}
.empty{text-align:center;color:var(--sub);padding:48px 20px;line-height:1.5}
.spin{margin:50px auto;width:26px;height:26px;border:3px solid #cfe8fb;border-top-color:var(--blue);border-radius:50%;animation:sp 0.8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* side menu */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;animation:fi .2s}
@keyframes fi{from{opacity:0}}
.side{position:fixed;left:0;top:0;bottom:0;width:min(82vw,330px);background:#fff;z-index:51;padding:calc(14px + env(safe-area-inset-top)) 18px 20px;overflow-y:auto;animation:sl .22s ease-out}

.side .ac{display:flex;align-items:center;gap:10px}.side .ac .sp{flex:1}
.side .ac .mini{display:flex;gap:6px}.side .ac .dots{width:30px;height:30px;border-radius:50%;border:1px solid #cfd9de;display:flex;align-items:center;justify-content:center}

.side .adm{color:#f97316}
/* sheet & forms */
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;background:#fff;border-radius:18px 18px 0 0;z-index:61;display:flex;flex-direction:column;animation:up .25s ease-out;max-width:600px;margin:0 auto}

.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet .sh b{font-size:16px}.sheet .sh button{color:var(--blue);font-weight:600}
.sheet .sb{overflow-y:auto;padding:12px 16px 40px}
.f{margin-bottom:14px}.f label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
.f input[type=text],.f input[type=number],.f input[type=datetime-local],.f input[type=date],.f textarea,.f select{width:100%;border:1px solid #cfd9de;border-radius:10px;padding:10px 12px;font-size:15px;background:#fff;outline:0}

.del{width:100%;color:#f4212e;border:1px solid #f4212e;border-radius:20px;padding:10px;font-weight:700;margin-top:8px}

.as .g{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:8px}

.as button.red{color:#f4212e}.as .tt{padding:12px;text-align:center;color:var(--sub);font-size:13px;border-bottom:1px solid var(--line)}

.btnp{background:var(--ink);color:#fff;border-radius:20px;padding:9px 16px;font-weight:700}
.embed .nav{padding-bottom:calc(16px + env(safe-area-inset-bottom))}.embed #app{padding-bottom:80px}.embed .fab{bottom:92px}
#splash{position:fixed;inset:0;background:#000;z-index:999;display:flex;align-items:center;justify-content:center;transition:opacity .35s}

.epbar{background:#fff4e5;color:#c2410c;font-size:12.5px;text-align:center;padding:6px;cursor:pointer;position:relative;z-index:21}

/* data */
const acc=id=>byId(W.accounts,id)||{name:'(삭제된 계정)',handle:'unknown'};
/* 회차 */
function curEP(){const pub=+W.settings.publicEp||0;const q=+(QS.get('ep')||0);if(ADMIN&&UI.prevEp!=null)return UI.prevEp;if(q)return q;if(ADMIN)return Infinity;return pub||Infinity}
const vis=x=>{const E=curEP(),e=+x.ep||0,u=+x.epEnd||0;return (!e||e<=E)&&(!u||E<u)};
const PV=()=>W.posts.filter(vis),NV=()=>W.notifs.filter(vis),TV=()=>W.trends.filter(vis),CV=()=>W.chats.filter(vis),MV=c=>(c.msgs||[]).filter(vis);
function av(a,size=40,click=true){const s=`width:${size}px;height:${size}px`;const on=click&&a&&a.id?` onclick="event.stopPropagation();go('profile',{id:'${a.id}'})"`:'';return a&&a.avatar?`<img class="av" src="${esc(a.avatar)}" style="${s}"${on} alt="">`:`<span class="avb" style="${s}"${on}>${I.personf}</span>`}
const nameRow=a=>`<b>${esc(a.name)}</b>${a.locked?I.lock:''}${a.verified?I.verified:''}`;
function linkify(t){return esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" onclick="event.stopPropagation()">$1</a>').replace(/(^|\s)([@#][\w가-힣_.]+)/g,'$1<span class="m">$2</span>')}
function mediaGrid(m){m=(m||[]).filter(Boolean).slice(0,4);if(!m.length)return'';return `<div class="md n${m.length}">${m.map(u=>isVid(u)?`<video src="${esc(u)}#t=0.1" playsinline muted controls preload="metadata" onclick="event.stopPropagation()"></video>`:`<img src="${esc(u)}" loading="lazy" alt="" onclick="event.stopPropagation();viewImg('${esc(u)}')">`).join('')}</div>`}
function quoteCard(id){const q=byId(PV(),id);if(!q)return'';const a=acc(q.acc);return `<div class="qt" onclick="event.stopPropagation();go('post',{id:'${q.id}'})"><div class="in"><div class="hd">${av(a,20,false)}${nameRow(a)}<span class="h">@${esc(a.handle)} · ${rel(q.date)}</span></div>${q.text?`<div class="tx">${linkify(q.text)}</div>`:''}</div>${mediaGrid(q.images)}</div>`}
function linkCard(l){if(!l||!(l.img||l.title||l.src))return'';return `<div class="lc"><div class="im">${l.img?`<img src="${esc(l.img)}" alt="">`:esc((l.title||'').toUpperCase().slice(0,12))}</div>${l.title?`<span class="tg">${esc(l.title)}</span>`:''}</div>${l.src?`<div class="lcs">출처: ${esc(l.src)}</div>`:''}`}
function replyLabel(p){if(p.replyTo)return p.replyTo;const t=p.replyOf&&byId(PV(),p.replyOf);return t?'@'+acc(t.acc).handle:''}
function actions(p,big){const L=UI.likes[p.id],B=UI.bms[p.id],R=UI.rps[p.id];return `<div class="act" onclick="event.stopPropagation()"><button>${I.reply}${big?'':kn(p.replies)}</button><button class="rp ${R?'on':''}" onclick="tg('rps','${p.id}')">${I.rt}${big?'':kn((+p.reposts||0)+(R?1:0))}</button><button class="lk2 ${L?'on':''}" onclick="tg('likes','${p.id}')">${L?I.heartf:I.heart}${big?'':kn((+p.likes||0)+(L?1:0))}</button>${big?'':`<button>${I.views}${kn(p.views)}</button>`}<span style="display:flex;gap:14px"><button class="bm ${B?'on':''}" onclick="tg('bms','${p.id}')">${B?I.bmf:I.bm}</button><button>${I.share}</button></span></div>`}
window.tg=(k,id)=>{UI[k][id]=!UI[k][id];render(true)};
function postHTML(p,o={}){const a=acc(p.acc);const rl=replyLabel(p);
 return `<article class="pst" onclick="go('post',{id:'${p.id}'})"><div class="l">${av(a,40)}</div><div class="r">${o.pinned?`<div class="pin">${I.pin}메인에 올림</div>`:''}<div class="hd">${nameRow(a)}<span class="h">@${esc(a.handle)} · ${rel(p.date)}</span><button class="mo" onclick="event.stopPropagation();postMenu('${p.id}')">${I.more}</button></div>${rl?`<div class="rt"><span>${esc(rl)}</span> 님에게 보내는 답글</div>`:''}${p.text?`<div class="tx">${linkify(p.text)}</div>`:''}${mediaGrid(p.images)}${p.quote?quoteCard(p.quote):''}${linkCard(p.link)}${actions(p)}</div></article>`}
const sortD=a=>a.slice().sort((x,y)=>String(y.date).localeCompare(x.date));
/* nav */
window.go=(v,p={})=>{STACK.push({v,p});render();scrollTo(0,0)};
window.back=()=>{if(STACK.length>1)STACK.pop();render()};
window.tab=v=>{STACK=[{v,p:{}}];render();scrollTo(0,0)};
function navBar(){const v=STACK[0].v;const b=(k,a,f)=>`<button onclick="tab('${k}')">${v===k?f:a}</button>`;return `<nav class="nav"><div class="in">${b('home',I.home,I.homef)}${b('explore',I.search,I.search.replace('stroke-width="2.2"','stroke-width="3"'))}<button><img src="${GROK}" alt="" style="width:25px;height:auto"></button>${b('notifs',I.bell,I.bellf)}${b('chats',I.chat,I.chatf)}</div></nav>`}
const meAv=()=>`<span onclick="sideMenu()" style="cursor:pointer">${av(ME,32,false)}</span>`;
function fab(fn,icon=I.plus){return `<button class="fab" onclick="${fn}">${icon}</button>`}

V.post=p=>{const x=byId(PV(),p.id);if(!x)return hdr('게시물')+'<div class="empty">게시물을 찾을 수 없어요.</div>';const a=acc(x.acc);const rl=replyLabel(x);const reps=sortD(PV().filter(r=>r.replyOf===x.id)).reverse();

 return `<div class="top"><div class="bar">${meAv()}<span class="t">알림</span><span style="width:32px;display:flex;justify-content:flex-end">${I.gear}</span></div><div class="tabs"><button class="${UI.ntTab==='all'?'on':''}" onclick="UI.ntTab='all';render()"><span style="display:inline-flex;align-items:center;gap:4px">${UI.ntTab==='all'?I.bellf.replace('class="ic"','style="width:18px;height:18px"'):I.bell.replace('class="ic"','style="width:18px;height:18px"')}모두</span></button><button class="${UI.ntTab==='men'?'on':''}" onclick="UI.ntTab='men';render()">멘션</button></div></div>
 ${W.settings.notifBanner!==false&&!UI.nbHide&&UI.ntTab==='all'?`<div class="nb"><div><b>알림이 비활성화되었습니다</b><p>X에서 쪽지를 받거나 새 팔로워가 생기거나 게시물이 인기 게시물이 되면 알림을 받습니다.</p></div><button class="x" onclick="UI.nbHide=true;render()">✕</button><span class="sw"></span></div>`:''}
 ${list.map(ntHTML).join('')||'<div class="empty">아직 알림이 없어요.</div>'}${fab("compose()")}`};
function ntHTML(n){const p=n.post&&byId(PV(),n.post);const ed=ADMIN?` onclick="editItem('notifs','${n.id}')"`:(p?` onclick="go('post',{id:'${p.id}'})"`:'');
 if((n.kind==='reply'||n.kind==='mention')&&p)return ADMIN?`<div onclick="editItem('notifs','${n.id}')" style="cursor:pointer">${postHTML(p).replace('onclick="go(','data-go="(')}</div>`:postHTML(p);
 const as=(n.actors||[]).map(acc);const names=as.length?(as.length===1?`<b>${esc(as[0].name)}</b>`:as.length===2?`<b>${esc(as[0].name)}</b> and <b>${esc(as[1].name)}</b>`:`<b>${esc(as[0].name)}</b> and ${as.length-1} others`):'';
 const icon=n.kind==='follow'?`<span style="color:var(--blue)">${I.personf}</span>`:n.kind==='repost'?`<span style="color:var(--green)">${I.rt}</span>`:`<span style="color:var(--pink)">${I.heartf}</span>`;
 const verb=n.text||(n.kind==='follow'?'followed you':n.kind==='repost'?'reposted your post':(n.count>1?`liked ${n.count} of your posts`:'liked your post'));
 const th=n.thumb||(p&&p.images&&p.images[0]);
 return `<div class="nt"${ed}><div class="ico">${icon}</div><div class="bd"><div class="avs">${as.slice(0,6).map(a=>av(a,32)).join('')}</div><div class="ln">${names} ${esc(verb)} <span>· ${rel(n.date)}</span></div>${p&&p.text?`<div class="sn">${esc(p.text)}</div>`:''}${n.count>1||n.showAll?'<span class="showall">Show all</span>':''}</div>${th&&!isVid(th)?`<img class="th" src="${esc(th)}" alt="">`:''}</div>`}
V.explore=()=>{const S=W.settings;const tabs=['탐색','실시간 트렌드','뉴스','스포츠','엔터테인먼트'];const q=UI.q||'';
 const res=q?sortD(PV().filter(p=>(p.text||'').toLowerCase().includes(q.toLowerCase())||acc(p.acc).name.includes(q)||acc(p.acc).handle.includes(q))):null;

  if(out.handle)out.handle=out.handle.replace(/^@/,'').trim();
  if(onSave(out)===false)return;save();close();render()}}
function actionSheet(t,opts){const d=document.createElement('div');d.innerHTML=`<div class="dim"></div><div class="as"><div class="g">${t?`<div class="tt">${esc(t)}</div>`:''}${opts.map((o,i)=>`<button data-i="${i}" class="${o.red?'red':''}">${esc(o.label)}</button>`).join('')}</div><div class="g"><button data-i="-1" style="font-weight:700">취소</button></div></div>`;document.body.appendChild(d);d.querySelector('.dim').onclick=()=>d.remove();d.querySelectorAll('.as button').forEach(b=>b.onclick=()=>{d.remove();const i=+b.dataset.i;if(i>=0)opts[i].fn()})}
/* upload */
function pickUpload(accept,multi){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept=accept;i.multiple=!!multi;i.onchange=async()=>{const out=[];let n=0;for(const f of i.files){n++;toast(`올리는 중 ${n}/${i.files.length}`);try{out.push(await upload(f))}catch(e){alert('업로드 실패: '+(e.message||e))}}res(out)};i.click()})}
async function shrink(f){if(!f.type.startsWith('image/')||f.type==='image/gif')return f;const img=await new Promise((r,j)=>{const im=new Image();im.onload=()=>r(im);im.onerror=j;im.src=URL.createObjectURL(f)});const m=1600,s=Math.min(1,m/Math.max(img.width,img.height));if(s===1&&f.size<1.5e6)return f;const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',.86))}
async function upload(f){const vid=f.type.startsWith('video/');const b=vid?f:await shrink(f);const m=(f.name||'').match(/\.([a-z0-9]+)$/i);const ext=vid?(m?m[1].toLowerCase():'mp4'):(b.type==='image/png'?'png':b.type==='image/gif'?'gif':'jpg');const path=`x/${Date.now().toString(36)}-${uid()}.${ext}`;const {error}=await SB.storage.from('phone-media').upload(path,b,{contentType:b.type||undefined});if(error)throw error;return SB.storage.from('phone-media').getPublicUrl(path).data.publicUrl}
/* save/load */
let saveT=null;function save(){if(!ADMIN)return;clearTimeout(saveT);saveT=setTimeout(async()=>{const {error}=await SB.from('x_world').upsert({id:'main',data:W,updated_at:new Date().toISOString()});if(error)toast('저장 실패: '+error.message)},500)}
function fixW(w){w=w||{};w.settings=w.settings||{};['accounts','posts','notifs','trends','chats'].forEach(k=>{if(!Array.isArray(w[k]))w[k]=[]});if(!w.accounts.length)w.accounts.push({id:uid(),name:'나',handle:'me',joined:nowS().slice(0,7),mine:true});return w}
function pickMe(){const h=(QS.get('me')||'').replace(/^@/,'').toLowerCase();ME=(h&&W.accounts.find(a=>String(a.handle).toLowerCase()===h))||byId(W.accounts,W.settings.me)||W.accounts[0]}
window.logout=async()=>{await SB.auth.signOut();location.href=location.pathname};
function loginView(){$('#app').innerHTML=`<div class="login"><div class="logo" style="text-align:center;margin-bottom:24px;font-size:40px">X</div><input id="le" type="email" placeholder="관리자 이메일" autocomplete="username"><input id="lp" type="password" placeholder="비밀번호" autocomplete="current-password"><button class="btnp" id="lb">로그인</button><p style="color:var(--sub);font-size:13px;margin-top:14px;text-align:center">가상 휴대폰과 같은 관리자 계정으로 로그인하세요.</p></div>`;
 $('#lb').onclick=async()=>{const {error}=await SB.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});if(error){alert('로그인 실패: '+error.message);return}location.href=location.pathname}}
function render(keep){const y=scrollY;const cur=STACK[STACK.length-1];const f=V[cur.v]||V.home;let h=f(cur.p||{});if(ADMIN&&cur.v!=='admin')h=`<div class="epbar" onclick="epPreview()">관리자 보기 · ${UI.prevEp!=null?UI.prevEp+'화까지 미리보기':'전체 회차'}${QS.get('ep')?` · 링크 ?ep=${esc(QS.get('ep'))}`:''}</div>`+h;const room=cur.v==='room';$('#app').innerHTML=h+(room?'':navBar());if(keep)scrollTo(0,y)}
async function boot(){if(!SB){$('#app').innerHTML='<div class="empty">연결 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</div>';return}
 if(QS.has('admin')&&!EMBED){const {data:{session}}=await SB.auth.getSession();if(!session){loginView();return}}
 try{const {data:{session}}=await SB.auth.getSession();if(session&&!EMBED){const {data}=await SB.from('phone_admins').select('user_id').eq('user_id',session.user.id).maybeSingle();ADMIN=!!data}}catch(e){}
 const {data,error}=await SB.from('x_world').select('data').eq('id','main').maybeSingle();
 if(error){$('#app').innerHTML=`<div class="empty">불러오지 못했어요.<br><small>${esc(error.message)}</small></div>`;return}
 W=fixW(data&&data.data);if(!data&&ADMIN)save();pickMe();
 const t=QS.get('tab');if(t&&V[t])STACK=[{v:t,p:{}}];render()}
if(EMBED)document.documentElement.classList.add('embed');
const SPLASH_AT=Date.now();
function hideSplash(){const s=$('#splash');if(!s)return;const w=Math.max(0,1000-(Date.now()-SPLASH_AT));setTimeout(()=>{s.classList.add('out');setTimeout(()=>s.remove(),400)},w)}
boot().finally(hideSplash);
</script></body></html>
